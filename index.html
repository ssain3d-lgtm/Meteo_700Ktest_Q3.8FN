<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>METEOR STRIKE — Ultimate Skill Demo</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --ember: #ff7a2a;
      --ember-hot: #ffc46a;
      --ink: #0b0d13;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: #e8e2d8; font-family: "Segoe UI", system-ui, sans-serif; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #ui {
      position: fixed; top: 16px; left: 16px; width: 268px; z-index: 10;
      background: rgba(12, 13, 18, 0.82);
      border: 1px solid rgba(255, 122, 42, 0.28);
      border-radius: 12px; padding: 14px 14px 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    }
    #ui h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: 0.16em; color: var(--ember-hot); text-transform: uppercase; }
    #ui .sub { margin: 0 0 12px; font-size: 11px; letter-spacing: 0.08em; color: #8b8378; }
    #phasebox { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    #phase {
      font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: #fff;
      background: rgba(255, 122, 42, 0.16); border: 1px solid rgba(255, 122, 42, 0.4);
      border-radius: 6px; padding: 5px 10px; min-width: 108px; text-align: center;
    }
    #phasebar { --i: 0; flex: 1; height: 6px; border-radius: 3px; overflow: hidden;
      background: linear-gradient(90deg, #2a2f3a 0%, #2a2f3a 100%); position: relative; }
    #phasebar::after { content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, var(--ember), var(--ember-hot));
      transform: scaleX(calc((var(--i) + 1) / 8)); transform-origin: left; transition: transform .4s ease; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 12px; }
    button {
      font: inherit; font-size: 11.5px; letter-spacing: 0.05em; color: #f0e8dd;
      background: rgba(255, 122, 42, 0.12); border: 1px solid rgba(255, 122, 42, 0.35);
      border-radius: 7px; padding: 8px 6px; cursor: pointer; transition: background .15s, border-color .15s;
    }
    button:hover { background: rgba(255, 122, 42, 0.26); border-color: rgba(255, 180, 90, 0.7); }
    button.primary { grid-column: 1 / -1; background: rgba(255, 122, 42, 0.3); border-color: var(--ember); font-weight: 700; }
    button.off { opacity: 0.5; }
    #sliders { display: grid; gap: 7px; }
    .slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; font-size: 11px; color: #a9a296; }
    .slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--ember); height: 16px; }
    .slider em { font-style: normal; color: var(--ember-hot); font-variant-numeric: tabular-nums; }
    #hint { position: fixed; right: 16px; bottom: 14px; z-index: 10; font-size: 11px; color: #6f6a62; letter-spacing: 0.06em; }
    @media (max-width: 640px) {
      #ui { width: calc(100vw - 32px); }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="ui">
    <h1>Meteor Strike</h1>
    <p class="sub">Ultimate Skill &middot; Three.js VFX Demo</p>
    <div id="phasebox">
      <div id="phase">IDLE</div>
      <div id="phasebar"></div>
    </div>
    <div class="btns">
      <button id="btn-summon">Summon</button>
      <button id="btn-charge">Charge</button>
      <button id="btn-warning">Sky Warning</button>
      <button id="btn-cast">Cast Meteor</button>
      <button id="btn-demo" class="primary">Full Demo</button>
      <button id="btn-reset">Reset</button>
      <button id="btn-sound">Sound: ON</button>
    </div>
    <div id="sliders"></div>
  </div>
  <div id="hint">Click Full Demo for the complete sequence</div>

  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
